<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Ketukan</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   BAGIAN NOT
========================= */

#bagianNot {
    height: 50vh;
    width: 100%;
    display: flex;
    flex-direction: column;
}

.birama {
    height: 50%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #ddd;
    overflow: hidden;
}

.not-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    width: 100%;
    height: 100%;
}

/* =========================
   SIMBOL NOT SEDERHANA
========================= */

.not {
    position: relative;
    width: 65px;
    height: 100px;
}

/* garis tengah */
.garis-horizontal {
    position: absolute;
    width: 62px;
    height: 3px;
    background: #111;
    left: 1px;
    top: 55px;
}

/* kepala not */
.kepala {
    position: absolute;
    width: 34px;
    height: 23px;
    left: 13px;
    top: 44px;
    border: 3px solid #111;
    border-radius: 50%;
    transform: rotate(-12deg);
}

/* not hitam */
.hitam .kepala {
    background: #111;
}

/* batang */
.batang {
    position: absolute;
    width: 3px;
    height: 55px;
    left: 44px;
    top: 4px;
    background: #111;
}

/* bendera */
.bendera {
    position: absolute;
    width: 22px;
    height: 25px;
    left: 44px;
    top: 4px;
    border-top: 3px solid #111;
    border-right: 3px solid #111;
    border-radius: 0 12px 0 0;
}


/* =========================
   NOT 4 KETUK
   WHOLE NOTE
========================= */

.not-4 .kepala {
    background: white;
}

.not-4 .batang,
.not-4 .bendera {
    display: none;
}


/* =========================
   NOT 2 KETUK
   HALF NOTE
========================= */

.not-2 .kepala {
    background: white;
}


/* =========================
   NOT 1 KETUK
   QUARTER NOTE
========================= */

.not-1 .batang {
    display: block;
}

.not-1 .bendera {
    display: none;
}


/* =========================
   NOT 1/2 KETUK
   EIGHTH NOTE
========================= */

.not-05 .batang,
.not-05 .bendera {
    display: block;
}


/* =========================
   DUA NOT 1/2 KETUK TERSAMBUNG
========================= */

.dua-eighth {
    position: relative;
    width: 100px;
    height: 100px;
}

/* kepala pertama */
.dua-eighth .kepala1,
.dua-eighth .kepala2 {
    position: absolute;
    width: 31px;
    height: 21px;
    background: #111;
    border-radius: 50%;
    transform: rotate(-12deg);
    top: 45px;
}

.dua-eighth .kepala1 {
    left: 5px;
}

.dua-eighth .kepala2 {
    left: 55px;
}

/* batang */
.dua-eighth .batang1,
.dua-eighth .batang2 {
    position: absolute;
    width: 3px;
    height: 55px;
    background: #111;
    top: 5px;
}

.dua-eighth .batang1 {
    left: 34px;
}

.dua-eighth .batang2 {
    left: 84px;
}

/* garis penyambung */
.dua-eighth .beam {
    position: absolute;
    width: 53px;
    height: 8px;
    background: #111;
    left: 34px;
    top: 5px;
}


/* =========================
   ISTIRAHAT
========================= */

.rest {
    position: relative;
    width: 65px;
    height: 100px;
}

/* garis */
.rest .garis-horizontal {
    width: 62px;
    left: 1px;
}

/* =========================
   ISTIRAHAT 4 KETUK
========================= */

.rest-4 .rest-bentuk {
    position: absolute;
    width: 32px;
    height: 18px;
    background: #111;
    left: 16px;
    top: 48px;
}

.rest-4 .garis-horizontal {
    top: 48px;
}


/* =========================
   ISTIRAHAT 2 KETUK
========================= */

.rest-2 .rest-bentuk {
    position: absolute;
    width: 32px;
    height: 18px;
    background: #111;
    left: 16px;
    top: 30px;
}

.rest-2 .garis-horizontal {
    top: 48px;
}


/* =========================
   ISTIRAHAT 1 KETUK
========================= */

.rest-1 .rest-bentuk {
    position: absolute;
    width: 8px;
    height: 48px;
    background: #111;
    left: 29px;
    top: 27px;
    transform: rotate(25deg);
}

.rest-1 .garis-horizontal {
    top: 51px;
}


/* =========================
   ISTIRAHAT 1/2 KETUK
========================= */

.rest-05 .rest-bentuk {
    position: absolute;
    width: 7px;
    height: 35px;
    background: #111;
    left: 29px;
    top: 32px;
    transform: rotate(-25deg);
}

.rest-05 .garis-horizontal {
    top: 51px;
}


/* =========================
   GARIS PEMBATAS BIRAMA
========================= */

.garis-birama {
    width: 3px;
    height: 75px;
    background: #111;
}


/* =========================
   STATUS
========================= */

#status {
    position: absolute;
    top: 5px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    pointer-events: none;
}

.benar {
    color: green;
}

.salah {
    color: red;
}


/* =========================
   BAGIAN TOMBOL
========================= */

#bagianKetuk {
    height: 50vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}


/* =========================
   TOMBOL BESAR
========================= */

#tombolBesar {
    width: min(65vw, 300px);
    height: min(65vw, 300px);
    border-radius: 50%;
    border: none;
    background: #eeeeee;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.18),
        inset 0 -5px 0 rgba(0,0,0,0.08);

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

#tombolBesar.ditekan {
    transform: scale(0.93);
    background: #d5d5d5;
}


/* =========================
   FLASH
========================= */

.flash-benar {
    animation: benar 0.15s;
}

.flash-salah {
    animation: salah 0.15s;
}

@keyframes benar {
    50% {
        background: #caffca;
    }
}

@keyframes salah {
    50% {
        background: #ffcccc;
    }
}
</style>


<body>

<div id="bagianNot">

    <div class="birama" id="birama0"></div>

    <div class="birama" id="birama1"></div>

</div>


<div id="bagianKetuk">

    <div id="status"></div>

    <button id="tombolBesar"></button>

</div>


<script>

/* =========================
   TEMPO
========================= */

const BPM = 60;
const BEAT = 60000 / BPM;
const TOLERANSI = 167;


/* =========================
   AUDIO
========================= */

let audioContext = null;
let pianoVoices = [];
let metronomAktif = false;
let metronomTimer = null;


/* =========================
   AUDIO CONTEXT
========================= */

function siapkanAudio() {

    if (!audioContext) {
        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


/* =========================
   PIANO E4
========================= */

function pianoE4() {

    siapkanAudio();

    hentikanPiano();

    const now =
        audioContext.currentTime;

    const master =
        audioContext.createGain();

    master.gain.setValueAtTime(
        0.0001,
        now
    );

    master.gain.exponentialRampToValueAtTime(
        0.45,
        now + 0.008
    );

    master.gain.exponentialRampToValueAtTime(
        0.18,
        now + 0.20
    );

    master.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 3
    );

    master.connect(
        audioContext.destination
    );


    const harmonics = [
        [1, 1.00],
        [2, 0.38],
        [3, 0.18],
        [4, 0.09],
        [5, 0.04]
    ];


    harmonics.forEach(
        ([kelipatan, volume]) => {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            osc.type = "sine";

            osc.frequency.value =
                329.63 * kelipatan;

            gain.gain.value =
                volume;

            osc.connect(gain);
            gain.connect(master);

            osc.start(now);
            osc.stop(now + 3.1);

            pianoVoices.push(osc);
        }
    );
}


/* =========================
   HENTIKAN PIANO
========================= */

function hentikanPiano() {

    if (!audioContext)
        return;

    pianoVoices.forEach(
        voice => {

            try {
                voice.stop(
                    audioContext.currentTime
                    + 0.01
                );
            } catch (e) {}

        }
    );

    pianoVoices = [];
}


/* =========================
   METRONOM KAYU
========================= */

function bunyiMetronom(aksen) {

    siapkanAudio();

    const now =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "triangle";

    osc.frequency.setValueAtTime(
        aksen ? 1800 : 1200,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        aksen ? 800 : 550,
        now + 0.05
    );

    gain.gain.setValueAtTime(
        aksen ? 0.42 : 0.25,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.06
    );

    osc.connect(gain);
    gain.connect(
        audioContext.destination
    );

    osc.start(now);
    osc.stop(now + 0.07);
}


/* =========================
   MULAI METRONOM
========================= */

function mulaiMetronom() {

    if (metronomAktif)
        return;

    metronomAktif = true;

    let ketukan = 0;

    function tick() {

        if (!metronomAktif)
            return;

        bunyiMetronom(
            ketukan === 0
        );

        ketukan++;

        if (ketukan >= 4)
            ketukan = 0;

        metronomTimer =
            setTimeout(
                tick,
                BEAT
            );
    }

    tick();
}


/* =========================
   JENIS SIMBOL
========================= */

const JENIS = {

    whole: {
        durasi: 4
    },

    half: {
        durasi: 2
    },

    quarter: {
        durasi: 1
    },

    eighth: {
        durasi: 0.5
    },

    wholeRest: {
        durasi: 4,
        rest: true
    },

    halfRest: {
        durasi: 2,
        rest: true
    },

    quarterRest: {
        durasi: 1,
        rest: true
    },

    eighthRest: {
        durasi: 0.5,
        rest: true
    }
};


/* =========================
   BIRAMA ACAK
========================= */

function buatBirama() {

    let hasil = [];
    let sisa = 4;

    while (sisa > 0) {

        let pilihan = [];

        if (sisa >= 4)
            pilihan.push(
                "whole",
                "wholeRest"
            );

        if (sisa >= 2)
            pilihan.push(
                "half",
                "halfRest"
            );

        if (sisa >= 1)
            pilihan.push(
                "quarter",
                "quarterRest"
            );

        if (sisa >= 0.5)
            pilihan.push(
                "eighth",
                "eighthRest"
            );


        const jenis =
            pilihan[
                Math.floor(
                    Math.random() *
                    pilihan.length
                )
            ];


        hasil.push(jenis);

        sisa -=
            JENIS[jenis].durasi;
    }


    /*
       Kadang dua not seperdelapan
       disambungkan.
    */

    let hasil2 = [];

    for (
        let i = 0;
        i < hasil.length;
        i++
    ) {

        if (
            hasil[i] === "eighth" &&
            hasil[i + 1] === "eighth" &&
            Math.random() < 0.5
        ) {

            hasil2.push(
                "connectedEighth"
            );

            i++;

        } else {

            hasil2.push(
                hasil[i]
            );
        }
    }

    return hasil2;
}


/* =========================
   DATA BIRAMA
========================= */

let birama = [
    buatBirama(),
    buatBirama()
];


/* =========================
   GAMBAR SIMBOL
========================= */

function tampilkanBirama(index) {

    const tempat =
        document.getElementById(
            "birama" + index
        );

    tempat.innerHTML = "";

    const container =
        document.createElement(
            "div"
        );

    container.className =
        "not-container";


    birama[index].forEach(
        jenis => {

            let elemen;


            /* DUA SEPERDELAPAN */

            if (
                jenis ===
                "connectedEighth"
            ) {

                elemen =
                    document.createElement(
                        "div"
                    );

                elemen.className =
                    "dua-eighth";

                elemen.innerHTML = `
                    <div class="kepala1"></div>
                    <div class="kepala2"></div>
                    <div class="batang1"></div>
                    <div class="batang2"></div>
                    <div class="beam"></div>
                `;
            }


            /* NOT */

            else if (
                !JENIS[jenis].rest
            ) {

                elemen =
                    document.createElement(
                        "div"
                    );

                elemen.className =
                    "not " +
                    (
                        jenis === "whole"
                        ? "not-4"
                        : jenis === "half"
                        ? "not-2"
                        : jenis === "quarter"
                        ? "not-1 hitam"
                        : "not-05 hitam"
                    );

                elemen.innerHTML = `
                    <div class="kepala"></div>
                    <div class="batang"></div>
                    <div class="bendera"></div>
                    <div class="garis-horizontal"></div>
                `;
            }


            /* ISTIRAHAT */

            else {

                elemen =
                    document.createElement(
                        "div"
                    );

                elemen.className =
                    "rest " +
                    (
                        jenis === "wholeRest"
                        ? "rest-4"
                        : jenis === "halfRest"
                        ? "rest-2"
                        : jenis === "quarterRest"
                        ? "rest-1"
                        : "rest-05"
                    );

                elemen.innerHTML = `
                    <div class="rest-bentuk"></div>
                    <div class="garis-horizontal"></div>
                `;
            }


            container.appendChild(
                elemen
            );
        }
    );


    const garis =
        document.createElement(
            "div"
        );

    garis.className =
        "garis-birama";

    container.appendChild(
        garis
    );

    tempat.appendChild(
        container
    );
}


/* =========================
   TAMPILKAN AWAL
========================= */

tampilkanBirama(0);
tampilkanBirama(1);


/* =========================
   SISTEM LATIHAN
========================= */

let waktuMulaiLatihan = null;

let jadwalKetukan = [];


/* =========================
   BUAT JADWAL
========================= */

function buatJadwal() {

    jadwalKetukan = [];

    let waktu = 0;


    for (
        let b = 0;
        b < 2;
        b++
    ) {

        for (
            let n = 0;
            n < birama[b].length;
            n++
        ) {

            const jenis =
                birama[b][n];

            const nama =
                jenis ===
                "connectedEighth"
                ? "eighth"
                : jenis;


            if (
                !JENIS[nama].rest
            ) {

                jadwalKetukan.push({
                    waktu: waktu
                });
            }


            waktu +=
                JENIS[nama].durasi;
        }
    }
}


/* =========================
   MULAI
========================= */

function mulaiLatihan() {

    if (
        waktuMulaiLatihan !== null
    )
        return;

    waktuMulaiLatihan =
        performance.now();

    buatJadwal();

    mulaiMetronom();
}


/* =========================
   TEKAN TOMBOL
========================= */

const tombol =
    document.getElementById(
        "tombolBesar"
    );


tombol.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        pianoE4();

        tombol.classList.add(
            "ditekan"
        );

        mulaiLatihan();


        const sekarang =
            performance.now() -
            waktuMulaiLatihan;


        let terdekat = null;
        let jarak = Infinity;


        jadwalKetukan.forEach(
            item => {

                const d =
                    Math.abs(
                        sekarang -
                        item.waktu * BEAT
                    );

                if (d < jarak) {

                    jarak = d;
                    terdekat = item;
                }
            }
        );


        if (
            terdekat &&
            jarak <= TOLERANSI
        ) {

            tampilkanBenar();

            const i =
                jadwalKetukan.indexOf(
                    terdekat
                );

            jadwalKetukan.splice(
                i,
                1
            );

        } else {

            tampilkanSalah();
        }

    }
);


tombol.addEventListener(
    "pointerup",
    function() {

        tombol.classList.remove(
            "ditekan"
        );
    }
);


tombol.addEventListener(
    "pointercancel",
    function() {

        tombol.classList.remove(
            "ditekan"
        );
    }
);


/* =========================
   LUAR TOMBOL = STOP PIANO
========================= */

document.addEventListener(
    "pointerdown",
    function(e) {

        if (
            !tombol.contains(
                e.target
            )
        ) {

            hentikanPiano();
        }
    },
    true
);


/* =========================
   FEEDBACK
========================= */

function tampilkanBenar() {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent = "✓";
    status.className = "benar";

    setTimeout(() => {

        status.textContent = "";
        status.className = "";

    }, 150);
}


function tampilkanSalah() {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent = "✕";
    status.className = "salah";

    setTimeout(() => {

        status.textContent = "";
        status.className = "";

    }, 180);
}

</script>

</body>
</html>
