<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Ketukan</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
}

/* =====================================================
   BAGIAN NOT
===================================================== */

#bagianNot {
    width: 100%;
    height: 50vh;
    display: flex;
    flex-direction: column;
    padding: 4px 10px;
}

.birama {
    width: 100%;
    height: 50%;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.birama:last-child {
    border-bottom: none;
}

.not-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 4vw, 35px);
}

.garis-birama {
    width: 3px;
    height: 105px;
    background: #111;
    margin-left: 5px;
}


/* =====================================================
   NOT BIASA
===================================================== */

.not {
    position: relative;
    width: 70px;
    height: 110px;
    flex-shrink: 0;
}

/* Kepala not */

.kepala {
    position: absolute;
    width: 39px;
    height: 28px;
    left: 12px;
    top: 51px;
    border: 4px solid #111;
    border-radius: 50%;
    transform: rotate(-15deg);
}

/* Kepala hitam */

.hitam .kepala {
    background: #111;
}

/* Batang */

.batang {
    position: absolute;
    width: 4px;
    height: 62px;
    left: 48px;
    top: 9px;
    background: #111;
}

/* Bendera */

.bendera {
    position: absolute;
    width: 27px;
    height: 31px;
    left: 48px;
    top: 9px;
    border-right: 5px solid #111;
    border-bottom: 5px solid #111;
    border-radius: 0 0 18px 0;
}

/* Garis horizontal menembus kepala */

.garis-horizontal {
    position: absolute;
    width: 66px;
    height: 4px;
    background: #111;
    left: 2px;
    top: 63px;
}


/* =====================================================
   NOT 4 KETUK
===================================================== */

.not-4 .batang,
.not-4 .bendera {
    display: none;
}

.not-4 .kepala {
    background: white;
}


/* =====================================================
   NOT 2 KETUK
===================================================== */

.not-2 .kepala {
    background: white;
}


/* =====================================================
   NOT 1 KETUK
===================================================== */

.not-1 .batang {
    display: block;
}

.not-1 .bendera {
    display: none;
}


/* =====================================================
   NOT 1/2 KETUK
===================================================== */

.not-05 .batang,
.not-05 .bendera {
    display: block;
}


/* =====================================================
   DUA NOT 1/2 KETUK TERSAMBUNG
===================================================== */

.dua-eighth {
    position: relative;
    width: 115px;
    height: 110px;
    flex-shrink: 0;
}

.eighth-kecil {
    position: absolute;
    width: 48px;
    height: 110px;
}

.eighth-kecil.kiri {
    left: 0;
}

.eighth-kecil.kanan {
    left: 43px;
}

.eighth-kecil .kepala {
    width: 34px;
    height: 25px;
    left: 7px;
    top: 53px;
    border-width: 4px;
    background: #111;
}

.eighth-kecil .batang {
    width: 4px;
    height: 64px;
    left: 37px;
    top: 10px;
    background: #111;
}

/* Balok penyambung */

.beam {
    position: absolute;
    left: 35px;
    top: 10px;
    width: 55px;
    height: 10px;
    background: #111;
}

.beam2 {
    position: absolute;
    left: 35px;
    top: 23px;
    width: 55px;
    height: 7px;
    background: #111;
}


/* =====================================================
   ISTIRAHAT
===================================================== */

.rest {
    position: relative;
    width: 75px;
    height: 110px;
    flex-shrink: 0;
}

/*
   Simbol istirahat dibuat menggunakan
   bentuk geometris agar tampil konsisten
   di Android.
*/

.rest-bentuk {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
}

/* 4 ketuk */

.rest-4 .rest-bentuk {
    width: 40px;
    height: 27px;
    top: 52px;
}

/* 2 ketuk */

.rest-2 .rest-bentuk {
    width: 40px;
    height: 27px;
    top: 27px;
}

/*
   Garis horizontal yang membedakan
   istirahat 4 dan 2 ketuk
*/

.rest .garis-horizontal {
    width: 68px;
    height: 4px;
    left: 3px;
}

.rest-4 .garis-horizontal {
    top: 65px;
}

.rest-2 .garis-horizontal {
    top: 40px;
}


/* 1 ketuk */

.rest-1 .rest-bentuk {
    width: 29px;
    height: 47px;
    top: 31px;
    transform:
        translateX(-50%)
        rotate(25deg);
}

.rest-1 .garis-horizontal {
    top: 53px;
}


/* 1/2 ketuk */

.rest-05 .rest-bentuk {
    width: 25px;
    height: 40px;
    top: 35px;
    transform:
        translateX(-50%)
        rotate(-25deg);
}

.rest-05 .garis-horizontal {
    top: 53px;
}


/* =====================================================
   STATUS
===================================================== */

#status {
    position: absolute;
    top: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    z-index: 5;
    pointer-events: none;
}

.benar {
    color: #159447;
}

.salah {
    color: #d11;
}


/* =====================================================
   BAGIAN TOMBOL
===================================================== */

#bagianKetuk {
    height: 50vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}


/* =====================================================
   TOMBOL BESAR
===================================================== */

#tombolBesar {
    width: min(65vw, 300px);
    height: min(65vw, 300px);

    border-radius: 50%;
    border: none;

    background: #eeeeee;

    box-shadow:
        0 9px 22px rgba(0,0,0,0.18),
        inset 0 -6px 0 rgba(0,0,0,0.08);

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;

    transition:
        transform 0.05s,
        background 0.06s;
}

#tombolBesar.ditekan {
    transform: scale(0.93);
    background: #d2d2d2;
}


/* =====================================================
   FLASH
===================================================== */

.flash-benar {
    animation: benar 0.15s;
}

.flash-salah {
    animation: salah 0.15s;
}

@keyframes benar {
    50% {
        background: #c9ffc9;
    }
}

@keyframes salah {
    50% {
        background: #ffc9c9;
    }
}

</style>
</head>


<body>

<!-- =====================================================
     DUA BIRAMA
===================================================== -->

<div id="bagianNot">

    <div class="birama" id="birama0"></div>

    <div class="birama" id="birama1"></div>

</div>


<!-- =====================================================
     TOMBOL
===================================================== -->

<div id="bagianKetuk">

    <div id="status"></div>

    <button id="tombolBesar"></button>

</div>


<script>

/* =====================================================
   PENGATURAN TEMPO
===================================================== */

const BPM = 60;

const BEAT = 60000 / BPM;

/*
   Toleransi ± 1/6 detik
   = sekitar 0,167 detik
*/

const TOLERANSI = 167;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

let pianoVoices = [];

let metronomAktif = false;

let metronomTimer = null;

let waktuMetronom = 0;


/* =====================================================
   MEMBUAT AUDIO CONTEXT
===================================================== */

function siapkanAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


/* =====================================================
   SUARA PIANO E4
===================================================== */

/*
   E4 = 329.63 Hz

   Dibuat menggunakan beberapa harmonik
   agar terdengar lebih seperti piano
   daripada suara oscillator tunggal.
*/

function pianoE4() {

    siapkanAudio();

    const now =
        audioContext.currentTime;


    /*
       Jika tombol besar ditekan lagi,
       buat serangan/petikan baru.
    */

    const master =
        audioContext.createGain();

    master.gain.setValueAtTime(
        0.0001,
        now
    );

    master.gain.exponentialRampToValueAtTime(
        0.45,
        now + 0.008
    );

    master.gain.exponentialRampToValueAtTime(
        0.18,
        now + 0.20
    );

    master.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 2.8
    );

    master.connect(
        audioContext.destination
    );


    /*
       Beberapa harmonik piano.
    */

    const harmonics = [
        [1, 1.00],
        [2, 0.38],
        [3, 0.18],
        [4, 0.09],
        [5, 0.045]
    ];


    harmonics.forEach(item => {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
            329.63 * item[0],
            now
        );

        gain.gain.setValueAtTime(
            item[1],
            now
        );

        oscillator.connect(gain);
        gain.connect(master);

        oscillator.start(now);

        oscillator.stop(now + 2.9);

        pianoVoices.push(
            oscillator
        );
    });
}


/* =====================================================
   HENTIKAN SUARA PIANO
===================================================== */

function hentikanPiano() {

    if (!audioContext)
        return;

    pianoVoices.forEach(voice => {

        try {
            voice.stop(
                audioContext.currentTime
                + 0.01
            );
        } catch (e) {}

    });

    pianoVoices = [];
}


/* =====================================================
   METRONOM KAYU
===================================================== */

/*
   Ketukan pertama:
   suara lebih tinggi dan lebih kuat.

   Ketukan lainnya:
   suara kayu biasa.
*/

function bunyiMetronom(aksen) {

    siapkanAudio();

    const now =
        audioContext.currentTime;


    /*
       Dua oscillator pendek dengan
       frekuensi berbeda memberikan
       karakter "klik kayu".
    */

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    osc.type = "triangle";

    if (aksen) {

        osc.frequency.setValueAtTime(
            1800,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            900,
            now + 0.045
        );

        gain.gain.setValueAtTime(
            0.42,
            now
        );

    } else {

        osc.frequency.setValueAtTime(
            1200,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            650,
            now + 0.045
        );

        gain.gain.setValueAtTime(
            0.25,
            now
        );
    }

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.055
    );

    osc.connect(gain);
    gain.connect(
        audioContext.destination
    );

    osc.start(now);

    osc.stop(now + 0.06);
}


/* =====================================================
   MEMULAI METRONOM
===================================================== */

function mulaiMetronom() {

    if (metronomAktif)
        return;

    siapkanAudio();

    metronomAktif = true;

    waktuMetronom =
        performance.now();

    let ketukan = 0;


    function tick() {

        if (!metronomAktif)
            return;

        bunyiMetronom(
            ketukan === 0
        );

        ketukan++;

        if (ketukan >= 4) {
            ketukan = 0;
        }

        metronomTimer =
            setTimeout(
                tick,
                BEAT
            );
    }

    tick();
}


/* =====================================================
   JENIS NOT
===================================================== */

const JENIS = {

    whole: {
        durasi: 4,
        kelas: "not not-4"
    },

    half: {
        durasi: 2,
        kelas: "not not-2"
    },

    quarter: {
        durasi: 1,
        kelas: "not not-1 hitam"
    },

    eighth: {
        durasi: 0.5,
        kelas: "not not-05 hitam"
    },

    wholeRest: {
        durasi: 4,
        rest: true,
        kelas: "rest rest-4"
    },

    halfRest: {
        durasi: 2,
        rest: true,
        kelas: "rest rest-2"
    },

    quarterRest: {
        durasi: 1,
        rest: true,
        kelas: "rest rest-1"
    },

    eighthRest: {
        durasi: 0.5,
        rest: true,
        kelas: "rest rest-05"
    }

};


/* =====================================================
   MEMBUAT BIRAMA ACAK
===================================================== */

function buatBirama() {

    const hasil = [];

    let sisa = 4;

    while (sisa > 0) {

        let pilihan = [];

        if (sisa >= 4) {

            pilihan.push(
                "whole",
                "wholeRest"
            );
        }

        if (sisa >= 2) {

            pilihan.push(
                "half",
                "halfRest"
            );
        }

        if (sisa >= 1) {

            pilihan.push(
                "quarter",
                "quarterRest"
            );
        }

        if (sisa >= 0.5) {

            pilihan.push(
                "eighth",
                "eighthRest"
            );
        }


        const jenis =
            pilihan[
                Math.floor(
                    Math.random() *
                    pilihan.length
                )
            ];


        hasil.push(jenis);

        sisa -=
            JENIS[jenis].durasi;

        sisa =
            Math.round(sisa * 10) / 10;
    }


    /*
       Kadang dua not 1/2 ketuk
       yang berdampingan disambung.
    */

    return sambungkanEighth(hasil);
}


/* =====================================================
   SAMBUNG DUA NOT 1/2 KETUK
===================================================== */

function sambungkanEighth(data) {

    const hasil = [];

    let i = 0;

    while (i < data.length) {

        if (
            data[i] === "eighth" &&
            data[i + 1] === "eighth" &&
            Math.random() < 0.5
        ) {

            hasil.push(
                "connectedEighth"
            );

            i += 2;

        } else {

            hasil.push(
                data[i]
            );

            i++;
        }
    }

    return hasil;
}


/* =====================================================
   DATA DUA BIRAMA
===================================================== */

let birama = [
    buatBirama(),
    buatBirama()
];


/* =====================================================
   MENAMPILKAN SIMBOL
===================================================== */

function tampilkanBirama(index) {

    const tempat =
        document.getElementById(
            "birama" + index
        );

    tempat.innerHTML = "";


    const container =
        document.createElement("div");

    container.className =
        "not-container";


    birama[index].forEach(jenis => {

        let elemen;


        /* ---------------------------------------------
           DUA NOT 1/2 KETUK TERSAMBUNG
        --------------------------------------------- */

        if (
            jenis ===
            "connectedEighth"
        ) {

            elemen =
                document.createElement(
                    "div"
                );

            elemen.className =
                "dua-eighth";

            elemen.innerHTML = `

                <div class="eighth-kecil kiri">
                    <div class="kepala"></div>
                    <div class="batang"></div>
                </div>

                <div class="eighth-kecil kanan">
                    <div class="kepala"></div>
                    <div class="batang"></div>
                </div>

                <div class="beam"></div>
                <div class="beam2"></div>
            `;

        }


        /* ---------------------------------------------
           NOT BIASA
        --------------------------------------------- */

        else if (
            !JENIS[jenis].rest
        ) {

            elemen =
                document.createElement(
                    "div"
                );

            elemen.className =
                JENIS[jenis].kelas;

            elemen.innerHTML = `

                <div class="kepala"></div>

                <div class="batang"></div>

                <div class="bendera"></div>

                <div class="garis-horizontal"></div>
            `;
        }


        /* ---------------------------------------------
           ISTIRAHAT
        --------------------------------------------- */

        else {

            elemen =
                document.createElement(
                    "div"
                );

            elemen.className =
                JENIS[jenis].kelas;

            elemen.innerHTML = `

                <div class="rest-bentuk"></div>

                <div class="garis-horizontal"></div>
            `;
        }


        container.appendChild(
            elemen
        );

    });


    const garis =
        document.createElement(
            "div"
        );

    garis.className =
        "garis-birama";

    container.appendChild(
        garis
    );


    tempat.appendChild(
        container
    );
}


/* =====================================================
   TAMPILKAN AWAL
===================================================== */

tampilkanBirama(0);
tampilkanBirama(1);


/* =====================================================
   SISTEM WAKTU LATIHAN
===================================================== */

let biramaAktif = 0;

let notAktif = 0;

let waktuMulaiLatihan = null;

let jadwalKetukan = [];


/* =====================================================
   BUAT JADWAL KETUKAN
===================================================== */

function buatJadwal() {

    jadwalKetukan = [];

    let waktu = 0;


    /*
       Buat jadwal berdasarkan not
       pada dua birama.
    */

    for (
        let b = 0;
        b < 2;
        b++
    ) {

        for (
            let n = 0;
            n < birama[b].length;
            n++
        ) {

            const jenis =
                birama[b][n];


            /*
               Rest tidak mempunyai
               ketukan yang harus ditekan.
            */

            if (
                !jenis.includes("Rest")
            ) {

                jadwalKetukan.push({

                    waktu: waktu,

                    birama: b,

                    not: n

                });
            }


            waktu +=
                JENIS[
                    jenis ===
                    "connectedEighth"
                    ? "eighth"
                    : jenis
                ].durasi;
        }
    }
}


/* =====================================================
   MULAI LATIHAN
===================================================== */

function mulaiLatihan() {

    if (
        waktuMulaiLatihan !== null
    ) {
        return;
    }

    waktuMulaiLatihan =
        performance.now();

    buatJadwal();

    mulaiMetronom();
}


/* =====================================================
   CARI KETUKAN YANG SEHARUSNYA
===================================================== */

function cariKetukanTerdekat(
    waktuSekarang
) {

    let terbaik = null;

    let jarakTerbaik =
        Infinity;


    jadwalKetukan.forEach(
        item => {

            const jarak =
                Math.abs(
                    waktuSekarang -
                    item.waktu
                );

            if (
                jarak < jarakTerbaik
            ) {

                jarakTerbaik = jarak;

                terbaik = item;
            }
        }
    );


    return {

        item: terbaik,

        jarak: jarakTerbaik
    };
}


/* =====================================================
   PROSES TEKANAN TOMBOL
===================================================== */

const tombolBesar =
    document.getElementById(
        "tombolBesar"
    );


tombolBesar.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();


        /*
           Suara piano selalu muncul
           ketika tombol besar ditekan.
        */

        pianoE4();


        tombolBesar.classList.add(
            "ditekan"
        );


        mulaiLatihan();


        const sekarang =
            (
                performance.now() -
                waktuMulaiLatihan
            );


        const hasil =
            cariKetukanTerdekat(
                sekarang
            );


        if (
            !hasil.item ||
            hasil.jarak >
            TOLERANSI
        ) {

            tampilkanSalah();

            return;
        }


        /*
           Ketukan benar.
        */

        tampilkanBenar();


        /*
           Hapus ketukan yang sudah
           berhasil dimainkan agar
           tidak bisa dinilai dua kali.
        */

        const index =
            jadwalKetukan.indexOf(
                hasil.item
            );

        if (index !== -1) {

            jadwalKetukan.splice(
                index,
                1
            );
        }


        /*
           Jika seluruh jadwal dua birama
           selesai, geser.
        */

        if (
            jadwalKetukan.length === 0
        ) {

            geserBirama();
        }

    }
);


tombolBesar.addEventListener(
    "pointerup",
    function() {

        tombolBesar.classList.remove(
            "ditekan"
        );
    }
);


tombolBesar.addEventListener(
    "pointercancel",
    function() {

        tombolBesar.classList.remove(
            "ditekan"
        );
    }
);


/* =====================================================
   GESER BIRAMA
===================================================== */

function geserBirama() {

    birama[0] =
        birama[1];

    birama[1] =
        buatBirama();


    tampilkanBirama(0);
    tampilkanBirama(1);


    waktuMulaiLatihan =
        performance.now();

    buatJadwal();
}


/* =====================================================
   SEMUA AREA KECUALI TOMBOL BESAR
   MENGHENTIKAN SUARA PIANO
===================================================== */

document.addEventListener(
    "pointerdown",
    function(e) {

        if (
            !tombolBesar.contains(
                e.target
            )
        ) {

            hentikanPiano();
        }
    },
    true
);


/*
   Menyentuh layar di luar tombol
   juga menghentikan piano.
*/

document.addEventListener(
    "touchstart",
    function(e) {

        if (
            !tombolBesar.contains(
                e.target
            )
        ) {

            hentikanPiano();
        }
    },
    true
);


/* =====================================================
   FEEDBACK
===================================================== */

function tampilkanBenar() {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent = "✓";

    status.className =
        "benar";


    document.body.classList.remove(
        "flash-salah"
    );

    void document.body.offsetWidth;

    document.body.classList.add(
        "flash-benar"
    );


    setTimeout(
        function() {

            status.textContent = "";

            status.className = "";

            document.body.classList.remove(
                "flash-benar"
            );

        },
        150
    );
}


function tampilkanSalah() {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent = "✕";

    status.className =
        "salah";


    document.body.classList.remove(
        "flash-benar"
    );

    void document.body.offsetWidth;

    document.body.classList.add(
        "flash-salah"
    );


    setTimeout(
        function() {

            status.textContent = "";

            status.className = "";

            document.body.classList.remove(
                "flash-salah"
            );

        },
        180
    );
}


/* =====================================================
